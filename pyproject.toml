[project]
name = "interview-trainer"
version = "0.2.0"
description = "A mock interview coach: transparent rule-based scoring plus written coaching from an AI coach."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "pyyaml>=6", "python-multipart>=0.0.9", "anthropic>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
