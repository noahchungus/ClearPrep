- id: sw-beh-01
  text: "Tell me about a technical project you are proud of. What was your role?"
  type: behavioral
  competency: problem_solving
  families: [software]
  difficulty: 1
  strong_answer:
    - "States what the project does, the tech used and your specific contribution."
    - "Describes one real technical challenge and how you solved it."
    - "Gives an outcome: users, performance, what you learned, what you would improve."

- id: sw-beh-02
  text: "Describe a time you were stuck on a bug for a long time. How did you get unstuck?"
  type: behavioral
  competency: problem_solving
  families: [software]
  difficulty: 2
  strong_answer:
    - "Describes the bug and why it was hard to find."
    - "Shows a systematic approach and when you asked for help."
    - "Names the root cause and what you now do to catch this class of bug."

- id: sw-sit-01
  text: "A senior developer leaves many critical comments on your first pull request. How do you respond?"
  type: situational
  competency: conflict
  families: [software]
  difficulty: 2
  strong_answer:
    - "Treats it as learning; reads each comment and asks questions about the reasoning."
    - "Fixes what is right and respectfully discusses what you disagree with."
    - "Notes patterns to avoid repeating the same feedback."

- id: sw-sit-02
  text: "You are asked to ship a feature by Friday but you find a security problem in the design. What do you do?"
  type: situational
  competency: ethics
  families: [software, cybersecurity]
  difficulty: 3
  strong_answer:
    - "Raises the issue right away with the lead, with a clear description of the risk."
    - "Proposes options: a quick mitigation, a reduced scope or a delayed launch."
    - "Documents the decision and follows up so it is not forgotten."
