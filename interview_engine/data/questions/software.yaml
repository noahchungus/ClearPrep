# Software / IT role family. Technical questions list `concepts`: groups of acceptable wordings.
# The analyzer checks that the ideas are MENTIONED, not that they are correct.

- id: sw-tech-01
  text: "What is the difference between an array (or list) and a hash map (dictionary), and when would you use each?"
  type: technical
  competency: technical
  families: [software]
  difficulty: 1
  concepts:
    - [array, list, arrays, lists]
    - [hash map, hashmap, dictionary, hash table, key-value, key value, map]
    - [lookup, "o(1)", constant time, constant-time, average constant]
    - [index, indexed, order, ordered, sequence]
    - [collision, collisions, hash function]
  strong_answer:
    - "Defines both in a sentence: ordered, indexed collection versus key-to-value mapping."
    - "Explains lookup: index access versus key lookup with average constant time."
    - "Gives a use case for each and mentions a trade-off (memory, ordering, collisions)."

- id: sw-tech-02
  text: "Explain what happens when you type a URL into a browser and press Enter."
  type: technical
  competency: technical
  families: [software]
  difficulty: 2
  concepts:
    - [dns, domain name]
    - [tcp, connection, handshake]
    - [http, https, request]
    - [server, response]
    - [render, rendering, dom, html, browser parses]
    - [tls, ssl, certificate, encryption, encrypted]
  strong_answer:
    - "Walks through in order: DNS lookup, connection, request, response, rendering."
    - "Mentions HTTPS/TLS and what the server returns."
    - "Stays high level but shows you know where each layer fits."

- id: sw-tech-03
  text: "What is the difference between a process and a thread?"
  type: technical
  competency: technical
  families: [software]
  difficulty: 2
  concepts:
    - [process, processes]
    - [thread, threads]
    - [memory, address space, shared memory]
    - [concurrency, parallel, parallelism, concurrent]
    - [context switch, scheduling, scheduler]
    - [race condition, deadlock, synchronization, lock, mutex]
  strong_answer:
    - "Defines a process as an isolated program instance and a thread as a unit of execution inside it."
    - "Explains that threads share memory and processes generally do not."
    - "Mentions a consequence such as race conditions or the cost of context switching."

- id: sw-tech-04
  text: "How would you debug a function that sometimes returns the wrong result?"
  type: technical
  competency: problem_solving
  families: [software]
  difficulty: 2
  concepts:
    - [reproduce, reproduction, reproducible]
    - [log, logging, print, prints]
    - [debugger, breakpoint, breakpoints, step through]
    - [isolate, narrow, bisect, minimal, smaller]
    - [race condition, state, input, environment, timing, concurrency]
    - [test, unit test, regression test, test case]
  strong_answer:
    - "Starts by reproducing the problem and finding the smallest failing input."
    - "Uses a method (logging, debugger, bisecting) rather than guessing."
    - "Ends by adding a test so it stays fixed."

