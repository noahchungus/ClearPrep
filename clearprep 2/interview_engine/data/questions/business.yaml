- id: bu-tech-10
  text: "How would you handle a client who is unhappy with something you delivered?"
  type: technical
  competency: conflict
  families: [business, marketing]
  difficulty: 2
  concepts:
    - [listen, understand, acknowledge]
    - [apologize, empathize, empathy]
    - [root cause, issue, problem]
    - [solution, fix, remedy, options]
    - [follow up, follow-up]
    - [expectations, communicate, communication]
  strong_answer:
    - "Listens first and acknowledges the frustration without defensiveness."
