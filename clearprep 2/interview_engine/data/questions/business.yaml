- id: bu-tech-09
  text: "Describe how you would run a small process improvement."
  type: technical
  competency: problem_solving
  families: [business]
  difficulty: 2
  concepts:
    - [map, current process, baseline, current state]
    - [bottleneck, waste, root cause]
    - [measure, metric, metrics]
    - [pilot, test, trial]
    - [stakeholders, buy-in, team]
    - [document, standard, standardize]
  strong_answer:
