- id: bu-tech-06
  text: "What is working capital, and why does it matter?"
  type: technical
  competency: technical
  families: [business]
  difficulty: 2
  concepts:
    - [current assets]
    - [current liabilities]
    - [liquidity, short-term, short term]
    - [cash, inventory, receivables, payables]
    - [operations, day-to-day, day to day]
  strong_answer:
    - "Defines it as current assets minus current liabilities."
    - "Explains that it shows the ability to meet short-term obligations."
    - "Gives an example of how inventory or receivables tie up cash."

