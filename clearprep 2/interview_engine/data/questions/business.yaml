# Business / Finance / Operations role family.

- id: bu-tech-01
  text: "Walk me through the three main financial statements and how they connect."
  type: technical
  competency: technical
  families: [business]
  difficulty: 2
  concepts:
    - [income statement, profit and loss, "p&l"]
    - [balance sheet]
    - [cash flow, cash flow statement]
    - [net income, retained earnings]
    - [assets, liabilities, equity]
    - [link, connect, flows, feeds]
  strong_answer:
    - "Names the income statement, balance sheet and cash flow statement and what each shows."
    - "Explains one link: net income flows into retained earnings, and cash flow reconciles cash."
    - "Uses one small example."

- id: bu-tech-02
  text: "What is the difference between revenue, profit and cash flow?"
  type: technical
  competency: technical
  families: [business]
  difficulty: 1
  concepts:
    - [revenue, sales, top line]
    - [profit, net income, margin, bottom line]
    - [cash flow, cash]
    - [timing, accrual, receivable, receivables]
    - [expenses, costs, cost]
  strong_answer:
    - "Defines each precisely: revenue is what is earned, profit is what is left after costs, cash flow is actual money moving."
    - "Explains that a profitable company can run out of cash because of timing."
    - "Gives an example."

- id: bu-tech-03
  text: "Three stakeholders each say their request is urgent. How do you prioritize?"
  type: technical
  competency: deadlines
  families: [business]
  difficulty: 2
  concepts:
    - [stakeholder, stakeholders]
    - [impact, importance, urgency, priority, prioritize]
    - [communicate, transparent, expectations]
    - [deadline, deadlines, due date]
    - [escalate, manager, ask]
  strong_answer:
    - "Uses explicit criteria (impact, deadline, effort) rather than who asked loudest."
    - "Communicates the plan and trade-offs to each stakeholder."
    - "Escalates to a manager if the priorities truly conflict."

- id: bu-tech-04
  text: "How would you build a simple budget or forecast for a small project?"
  type: technical
  competency: problem_solving
  families: [business]
  difficulty: 2
  concepts:
    - [assumptions, assumption]
    - [revenue, income]
    - [costs, expenses, fixed, variable]
    - [scenario, best case, worst case, sensitivity]
    - [actuals, variance, compare]
    - [review, update, revisit]
  strong_answer:
    - "Starts by listing assumptions and the sources of numbers."
    - "Separates fixed and variable costs and models a few scenarios."
    - "Plans to compare actuals to the forecast and update."

