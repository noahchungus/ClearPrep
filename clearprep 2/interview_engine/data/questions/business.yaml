- id: bu-beh-01
  text: "Tell me about a time you had to work carefully with numbers or data where accuracy really mattered."
  type: behavioral
  competency: problem_solving
  families: [business]
  difficulty: 1
  strong_answer:
    - "Describes what was at stake if it was wrong."
    - "Explains specific checks you used."
    - "Gives an outcome, and any error you caught."

- id: bu-beh-02
  text: "Describe a time you influenced a decision with an analysis or a recommendation."
  type: behavioral
  competency: communication
  families: [business, data]
  difficulty: 2
  strong_answer:
    - "Frames the decision and who needed to make it."
    - "Shows how you used evidence and presented options."
    - "Says what was decided and how you know it helped."

- id: bu-sit-01
  text: "You realize you will not finish a client deliverable by the deadline. What do you do?"
  type: situational
  competency: deadlines
  families: [business, marketing]
  difficulty: 2
  strong_answer:
    - "Tells your manager and the client early with a specific new date or a reduced scope."
    - "Explains what you would do to recover (prioritize, ask for help)."
    - "Follows up after delivery to rebuild trust."
