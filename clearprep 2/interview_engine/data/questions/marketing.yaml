    - "Explains how the calls to action and audiences differ."

- id: mk-tech-10
  text: "How do you keep a brand voice consistent across channels?"
  type: technical
  competency: communication
  families: [marketing]
  difficulty: 1
  concepts:
    - [brand voice, tone, style guide, voice]
    - [guidelines, guide, guideline]
    - [audience]
    - [templates, examples, template]
    - [review, approval, approve]
    - [channel, platform, adapt]
  strong_answer:
    - "Uses a style guide with examples of do and do-not."
