# Marketing / Communications role family.

- id: mk-tech-01
  text: "How would you measure the success of a social media campaign?"
  type: technical
  competency: technical
  families: [marketing]
  difficulty: 1
  concepts:
    - [goal, objective, objectives, goals]
    - [engagement, likes, comments, shares]
    - [reach, impressions]
    - [conversion, conversions, clicks, click-through, ctr]
    - [kpi, metric, metrics]
    - [baseline, benchmark, compare]
    - [audience]
  strong_answer:
    - "Starts with the campaign goal, then chooses metrics that match it."
    - "Distinguishes vanity metrics (likes) from outcome metrics (conversions, sign-ups)."
    - "Mentions comparing to a baseline or previous campaign."

- id: mk-tech-02
  text: "What is the difference between SEO and paid search?"
  type: technical
  competency: technical
  families: [marketing]
  difficulty: 1
  concepts:
    - [seo, organic]
    - [paid, ppc, sem, ads]
    - [keywords, keyword]
    - [cost, budget, pay per click]
    - [time, long-term, long term, immediate, results]
    - [intent, search intent]
  strong_answer:
    - "Says SEO earns organic rankings over time and paid search buys placement per click."
    - "Compares cost, speed and durability."
    - "Explains when you would combine them."

- id: mk-tech-03
  text: "How would you define the target audience for a new product?"
  type: technical
  competency: problem_solving
  families: [marketing]
  difficulty: 2
  concepts:
    - [demographics, demographic]
    - [needs, pain points, problems, pain point]
    - [research, survey, surveys, interviews, data]
    - [persona, personas, segment, segmentation]
    - [behavior, behaviour, psychographics]
    - [test, validate, validation]
  strong_answer:
    - "Starts with who has the problem the product solves."
    - "Uses research (surveys, interviews, data) rather than assumptions."
    - "Defines a segment or persona and plans to test it."

- id: mk-tech-04
  text: "Walk me through how you would plan a content calendar."
  type: technical
  competency: problem_solving
  families: [marketing]
  difficulty: 1
  concepts:
    - [goals, objectives, goal]
    - [audience]
    - [channels, platform, platforms, channel]
    - [frequency, cadence, schedule]
    - [themes, pillars, topics, theme]
    - [measure, analytics, performance]
    - [adjust, iterate, refine]
  strong_answer:
    - "Starts from goals and audience, then chooses channels."
    - "Sets a realistic cadence with themes."
    - "Reviews performance and adjusts."

- id: mk-tech-05
  text: "What makes a good email subject line, and how would you test it?"
  type: technical
  competency: technical
  families: [marketing]
  difficulty: 1
  concepts:
    - [clear, concise, short, length]
    - [personalize, personalization, personalized, name]
    - [urgency, curiosity, value]
    - [a/b test, split test, variant, ab test]
    - [open rate, opens]
    - [audience, segment]
    - [spam]
  strong_answer:
    - "Names qualities: clear, short, relevant, honest."
    - "Describes an A/B test with one variable at a time."
    - "Mentions measuring open and click rates on a sufficient sample."

- id: mk-tech-06
  text: "What is a marketing funnel?"
  type: technical
  competency: technical
  families: [marketing]
  difficulty: 1
  concepts:
    - [awareness]
    - [consideration, interest]
    - [conversion, purchase, decision]
    - [retention, loyalty, advocacy]
    - [top of funnel, middle, bottom]
    - [metrics, measure]
  strong_answer:
    - "Describes stages from awareness to consideration to conversion, and retention."
    - "Matches a tactic and a metric to each stage."
    - "Notes that real customer journeys are not always linear."

- id: mk-tech-07
  text: "How would you handle negative comments on a brand's social media page?"
  type: technical
  competency: conflict
  families: [marketing]
  difficulty: 2
  concepts:
    - [respond, reply, response]
    - [quickly, timely, promptly]
    - [empathy, apologize, acknowledge, empathize]
    - [private, dm, direct message, offline]
    - [policy, guidelines, guideline]
    - [escalate, team]
    - [transparent, delete]
  strong_answer:
    - "Responds quickly and publicly with empathy, then moves details to a private channel."
    - "Follows a documented policy (when to escalate or remove abusive content)."
    - "Uses feedback to inform the team."

- id: mk-tech-08
  text: "How would you use Google Analytics to understand website performance?"
  type: technical
  competency: technical
  families: [marketing, data]
  difficulty: 2
  concepts:
    - [traffic, sessions, users]
    - [source, channel, medium, referral]
    - [bounce rate, engagement, engaged]
    - [conversion, goal, event, events]
    - [pages, landing page, landing pages]
    - [audience, demographics]
    - [segment, segments]
  strong_answer:
    - "Starts with a question and a goal (for example, sign-ups)."
    - "Looks at traffic sources, top pages and conversions."
    - "Segments to find what is different and proposes a change to test."

- id: mk-tech-09
  text: "What is the difference between a brand awareness campaign and a lead generation campaign?"
  type: technical
  competency: technical
  families: [marketing]
  difficulty: 2
  concepts:
    - [awareness, reach, impressions]
    - [lead, leads, conversion, sign-up, signup]
    - [metrics, kpi, kpis]
    - [audience, cold, warm]
    - [call to action, cta]
    - [funnel]
  strong_answer:
