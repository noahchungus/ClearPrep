- id: mk-beh-01
  text: "Tell me about a creative project you conceived and carried out, such as a portfolio, campaign or club event."
  type: behavioral
  competency: initiative
  families: [marketing]
  difficulty: 1
  strong_answer:
    - "Describes the goal and audience."
    - "Shows what you personally created and the decisions you made."
    - "Gives a result: reach, feedback, attendance."

- id: mk-beh-02
  text: "Describe a time you used data or feedback to change a creative decision."
  type: behavioral
  competency: problem_solving
  families: [marketing]
  difficulty: 2
  strong_answer:
    - "States what you originally planned and the evidence that challenged it."
    - "Explains the change and how you tested it."
    - "Gives the impact and what you learned."

- id: mk-sit-01
  text: "A campaign you launched is performing far below expectations after one week. What do you do?"
  type: situational
  competency: problem_solving
  families: [marketing]
  difficulty: 2
  strong_answer:
    - "Checks the basics first: targeting, tracking, creative, landing page."
    - "Forms a hypothesis and tests one change at a time."
    - "Keeps stakeholders informed with a recovery plan."
